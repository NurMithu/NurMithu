<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="900" viewBox="0 0 1600 900"
     role="img"
     aria-label="Nur A Alam — Data Scientist, AI, Machine Learning and Business Analytics">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B11"/>
    <stop offset=".55" stop-color="#0B111A"/>
    <stop offset="1" stop-color="#0D1720"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5BC8E8"/>
    <stop offset="1" stop-color="#38AFCF"/>
  </linearGradient>

  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F4C06B"/>
    <stop offset="1" stop-color="#D98A39"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0" stop-color="#5BC8E8" stop-opacity=".18"/>
    <stop offset="1" stop-color="#5BC8E8" stop-opacity="0"/>
  </radialGradient>

  <filter id="soft">
    <feGaussianBlur stdDeviation="28"/>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="12" stdDeviation="22"
                  flood-color="#000" flood-opacity=".35"/>
  </filter>

  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
</defs>

<!-- BACKGROUND -->
<rect width="1600" height="900" rx="24" fill="url(#bg)"/>

<!-- Ambient glows -->
<circle cx="1320" cy="180" r="360" fill="url(#glow)" filter="url(#soft)"/>
<circle cx="150" cy="780" r="300" fill="url(#glow)" filter="url(#soft)"/>

<!-- Subtle grid -->
<g opacity=".055" stroke="#8BA3B5">
  <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600"/>
  <path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900M1200 0V900M1300 0V900M1400 0V900M1500 0V900"/>
</g>

<!-- TOP LABEL -->
<text x="90" y="92"
      class="mono"
      font-size="15"
      letter-spacing="5"
      fill="#5BC8E8">
  DATA • AI • BUSINESS ANALYTICS
</text>

<!-- LEFT HERO -->
<text x="90" y="185"
      class="sans"
      font-size="76"
      font-weight="750"
      fill="#F4F7FA">
  Nur A Alam
</text>

<text x="94" y="235"
      class="sans"
      font-size="30"
      font-weight="650"
      fill="#5BC8E8">
  Data Scientist
</text>

<text x="94" y="274"
      class="sans"
      font-size="18"
      fill="#AAB7C5">
  Machine Learning • Artificial Intelligence • Business Intelligence
</text>

<text x="94" y="308"
      class="sans"
      font-size="16"
      fill="#728394">
  Turning complex data into practical intelligence and measurable impact.
</text>

<!-- HERO TAGS -->
<g class="mono" font-size="13">
  <rect x="90" y="350" width="112" height="34" rx="17"
        fill="#101C25" stroke="#244453"/>
  <text x="112" y="372" fill="#BFE9F5">PYTHON</text>

  <rect x="214" y="350" width="82" height="34" rx="17"
        fill="#101C25" stroke="#244453"/>
  <text x="237" y="372" fill="#BFE9F5">SQL</text>

  <rect x="308" y="350" width="142" height="34" rx="17"
        fill="#101C25" stroke="#244453"/>
  <text x="330" y="372" fill="#BFE9F5">MACHINE LEARNING</text>

  <rect x="462" y="350" width="126" height="34" rx="17"
        fill="#101C25" stroke="#244453"/>
  <text x="485" y="372" fill="#BFE9F5">POWER BI</text>
</g>

<!-- HERO DIVIDER -->
<line x1="90" y1="420" x2="730" y2="420"
      stroke="#1D2B35"/>

<text x="90" y="458"
      class="mono"
      font-size="12"
      letter-spacing="3"
      fill="#E8A857">
  DATA → INSIGHT → DECISION
</text>

<!-- MINI METRICS -->
<g class="sans">
  <text x="90" y="515" font-size="28" font-weight="700" fill="#F1F5F9">01</text>
  <text x="90" y="540" font-size="13" fill="#7F909F">DATA STRATEGY</text>

  <text x="250" y="515" font-size="28" font-weight="700" fill="#F1F5F9">02</text>
  <text x="250" y="540" font-size="13" fill="#7F909F">PREDICTIVE ANALYTICS</text>

  <text x="475" y="515" font-size="28" font-weight="700" fill="#F1F5F9">03</text>
  <text x="475" y="540" font-size="13" fill="#7F909F">AI &amp; AUTOMATION</text>
</g>

<!-- RIGHT NETWORK PANEL -->
<rect x="790" y="72" width="720" height="500"
      rx="22"
      fill="#0A1118"
      stroke="#1D303B"
      filter="url(#shadow)"/>

<!-- Network heading -->
<text x="830" y="120"
      class="mono"
      font-size="12"
      letter-spacing="3"
      fill="#637785">
  INTELLIGENCE PIPELINE
</text>

<text x="830" y="153"
      class="sans"
      font-size="22"
      font-weight="650"
      fill="#E9F0F4">
  From raw signals to decisions
</text>

<!-- Network connections -->
<g stroke="#34505E" stroke-width="1.5" opacity=".7">
  <!-- input to hidden -->
  <path d="M850 230L1040 190"/>
  <path d="M850 230L1040 285"/>
  <path d="M850 330L1040 190"/>
  <path d="M850 330L1040 285"/>
  <path d="M850 430L1040 285"/>
  <path d="M850 430L1040 385"/>

  <!-- hidden -->
  <path d="M1040 190L1240 220"/>
  <path d="M1040 190L1240 330"/>
  <path d="M1040 285L1240 220"/>
  <path d="M1040 285L1240 330"/>
  <path d="M1040 285L1240 440"/>
  <path d="M1040 385L1240 330"/>
  <path d="M1040 385L1240 440"/>

  <!-- output -->
  <path d="M1240 220L1430 330"/>
  <path d="M1240 330L1430 330"/>
  <path d="M1240 440L1430 330"/>
</g>

<!-- Highlight paths -->
<g stroke="#5BC8E8" stroke-width="2.5" opacity=".65">
  <path d="M850 230L1040 285L1240 330L1430 330"/>
  <path d="M850 430L1040 385L1240 440L1430 330"/>
</g>

<!-- Input nodes -->
<g fill="#0E1820" stroke="#5BC8E8" stroke-width="2">
  <circle cx="850" cy="230" r="10"/>
  <circle cx="850" cy="330" r="10"/>
  <circle cx="850" cy="430" r="10"/>
</g>

<!-- Hidden nodes -->
<g fill="#0E1820" stroke="#5BC8E8" stroke-width="2">
  <circle cx="1040" cy="190" r="9"/>
  <circle cx="1040" cy="285" r="11"/>
  <circle cx="1040" cy="385" r="9"/>
</g>

<!-- Decision nodes -->
<g fill="#0E1820" stroke="#E8A857" stroke-width="2">
  <circle cx="1240" cy="220" r="10"/>
  <circle cx="1240" cy="330" r="12"/>
  <circle cx="1240" cy="440" r="10"/>
</g>

<!-- Output -->
<circle cx="1430" cy="330" r="18"
        fill="#0D1A21"
        stroke="#5BC8E8"
        stroke-width="3"/>

<circle cx="1430" cy="330" r="7"
        fill="#5BC8E8"/>

<!-- Network labels -->
<g class="mono" font-size="11">
  <text x="818" y="210" fill="#667B88">DATA</text>
  <text x="1005" y="165" fill="#667B88">MODEL</text>
  <text x="1200" y="195" fill="#667B88">INSIGHT</text>
  <text x="1400" y="305" fill="#E8A857">DECISION</text>
</g>

<!-- Bottom architecture -->
<rect x="90" y="610" width="1420" height="210"
      rx="22"
      fill="#0A1118"
      stroke="#1D303B"/>

<text x="125" y="657"
      class="mono"
      font-size="12"
      letter-spacing="3"
      fill="#637785">
  WHAT I BUILD
</text>

<!-- Cards -->
<g class="sans">

  <rect x="125" y="685" width="300" height="96"
        rx="12" fill="#101820" stroke="#1C303A"/>
  <circle cx="153" cy="715" r="7" fill="#5BC8E8"/>
  <text x="173" y="720" font-size="17"
        font-weight="650" fill="#F1F5F9">
    Business Intelligence
  </text>
  <text x="153" y="750" font-size="12" fill="#81929F">
    Dashboards • KPIs • Executive reporting
  </text>

  <rect x="450" y="685" width="300" height="96"
        rx="12" fill="#101820" stroke="#1C303A"/>
  <circle cx="478" cy="715" r="7" fill="#5BC8E8"/>
  <text x="498" y="720" font-size="17"
        font-weight="650" fill="#F1F5F9">
    Predictive Analytics
  </text>
  <text x="478" y="750" font-size="12" fill="#81929F">
    ML • Statistics • Forecasting
  </text>

  <rect x="775" y="685" width="300" height="96"
        rx="12" fill="#101820" stroke="#1C303A"/>
  <circle cx="803" cy="715" r="7" fill="#E8A857"/>
  <text x="823" y="720" font-size="17"
        font-weight="650" fill="#F1F5F9">
    AI &amp; Automation
  </text>
  <text x="803" y="750" font-size="12" fill="#81929F">
    Intelligent workflows • APIs • AI
  </text>

  <rect x="1100" y="685" width="375" height="96"
        rx="12" fill="#101820" stroke="#1C303A"/>
  <circle cx="1128" cy="715" r="7" fill="#E8A857"/>
  <text x="1148" y="720" font-size="17"
        font-weight="650" fill="#F1F5F9">
    Decision Intelligence
  </text>
  <text x="1128" y="750" font-size="12" fill="#81929F">
    Strategy • Analytics • Business impact
  </text>

</g>

<!-- FOOTER -->
<line x1="90" y1="850" x2="1510" y2="850"
      stroke="#172630"/>

<text x="90" y="875"
      class="mono"
      font-size="11"
      fill="#50616D">
  NUR A ALAM
</text>

<text x="1320" y="875"
      class="mono"
      font-size="11"
      fill="#50616D">
  DATA SCIENCE • AI • ANALYTICS
</text>

</svg>
